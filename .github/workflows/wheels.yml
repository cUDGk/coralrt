# The wheels: Windows x64, and Linux x86_64 and aarch64 (manylinux_2_28). Each one is installed into a fresh venv and
# run on the CPU models (there is no Coral here). On a v* tag they then go to PyPI (trusted publishing, from the
# pypi environment) and to a GitHub release.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo test --release
      - run: python python/build_wheel.py
      - name: Try the wheel
        shell: bash
        run: |
          python tests/fetch_test_data.py "$RUNNER_TEMP/test_data"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python" -m pip install python/dist/*.whl pillow
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/Scripts/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py" "$RUNNER_TEMP/test_data" --cpu
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x86_64
          path: python/dist/*.whl

  linux:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: docker run --rm -v "$PWD:/io" -w /io quay.io/pypa/manylinux_2_28_${{ matrix.arch }} bash python/build_manylinux.sh
      - name: Try the wheel
        run: |
          python tests/fetch_test_data.py "$RUNNER_TEMP/test_data"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install python/wheelhouse/*.whl pillow
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py" "$RUNNER_TEMP/test_data" --cpu
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: python/wheelhouse/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing
      contents: write # the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "pip install coralrt"
        env:
          GH_TOKEN: ${{ github.token }}
